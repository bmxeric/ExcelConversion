name: Build Windows EXE

"on":
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest test_excel_merge -v

      - name: Build single-file EXE
        run: python -m PyInstaller --clean --noconfirm ExcelConversion.spec

      - name: Verify output
        run: |
          if (-not (Test-Path -LiteralPath 'dist/ExcelConversion.exe' -PathType Leaf)) {
            throw 'The single-file EXE was not generated.'
          }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ExcelConversion-Windows-x64
          path: dist/ExcelConversion.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0